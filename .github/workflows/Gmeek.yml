name: build Gmeek

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]
  push:
    paths:
      - 'static/**'      # ← 上传/改动图片就自动重建并发布
  schedule:
    - cron: "0 16 * * *"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 并发控制：同一 issue 连续编辑时，取消旧的未完成 build，只保留最新一次。
# deploy job 已有独立的 pages 并发组（不取消，保证部署串行安全）。
concurrency:
  group: gmeek-build-${{ github.event_name == 'issues' && github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate blog
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id || github.event_name == 'schedule' }}
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Get config.json
        run: |
          echo "====== check config.josn file ======"
          cat config.json
          echo "====== check config.josn end  ======"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.8

      - name: Clone source code
        run: |
          # ubuntu-24.04 runner 已预装 jq，无需 apt-get install
          GMEEK_VERSION=$(jq -r ".GMEEK_VERSION" config.json)
          git clone --depth 1 https://github.com/iBitBetter/Gmeek.git /opt/Gmeek

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # Gmeek 依赖在克隆目录，无法用 hashFiles 指向 /opt；
          # requirements 极少变动，用固定 key + restore 前缀即可命中缓存。
          key: ${{ runner.os }}-pip-gmeek-v1
          restore-keys: |
            ${{ runner.os }}-pip-gmeek-

      - name: Install dependencies
        run: |
          # 去掉 --upgrade pip（runner 自带版本已够，省一次联网升级）
          pip install -r /opt/Gmeek/requirements.txt

      - name: Generate new html
        run: |
          cp -r ./* /opt/Gmeek/
          cd /opt/Gmeek/
          python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }} --issue_number '${{ github.event.issue.number }}'
          cp -a /opt/Gmeek/docs ${{ github.workspace }} 
          cp -a /opt/Gmeek/backup ${{ github.workspace }} 
          cp /opt/Gmeek/blogBase.json ${{ github.workspace }} 

      - name: Copy IndexNow key file to docs
        run: cp 10fe9d2dddb840799a2370388d792e93.txt docs/10fe9d2dddb840799a2370388d792e93.txt
        
      - name: update html
        run: |
          git config --local user.email "$(jq -r ".email" config.json)"
          git config --local user.name "${{ github.repository_owner }}"
          git add .
          git commit -a -m '🎉auto update by Gmeek action' || echo "nothing to commit"
          git push || echo "nothing to push"
          sleep 3
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/.'
          
  deploy:
    name: Deploy blog
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
